<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Наше свидание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;700;800&display=swap">
</head>
<body>
<style>
/* Одна карточка из «матового стекла» по центру, фон — размытые красные пятна. Единый тёмно-красный образ, без светлой темы. */
:root {
  --bg: #3d0710;
  --blob-1: #c8102e;
  --blob-2: #e0245e;
  --blob-3: #8a0a1e;
  --glass: rgba(255, 235, 238, 0.10);
  --glass-line: rgba(255, 220, 226, 0.28);
  --chip: rgba(255, 240, 242, 0.12);
  --chip-hover: rgba(255, 240, 242, 0.22);
  --accent: #ff2e4d;
  --accent-glow: rgba(255, 46, 77, 0.55);
  --fg: #fff5f6;
  --fg-soft: rgba(255, 236, 239, 0.75);
  --font-display: "Marck Script", "Segoe Script", cursive;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  overflow-x: hidden;
}

/* ---------- фон ---------- */
.backdrop { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blob {
  position: absolute; border-radius: 50%;
  filter: blur(80px); opacity: .85;
  animation: drift 22s ease-in-out infinite alternate;
}
.blob.b1 { width: 60vmax; height: 60vmax; background: var(--blob-1); top: -20vmax; left: -15vmax; }
.blob.b2 { width: 50vmax; height: 50vmax; background: var(--blob-2); bottom: -20vmax; right: -15vmax; animation-duration: 28s; opacity: .6; }
.blob.b3 { width: 40vmax; height: 40vmax; background: var(--blob-3); top: 30%; left: 40%; animation-duration: 34s; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(6vmax, 4vmax) scale(1.12); }
}
.heart-float {
  position: absolute; bottom: -40px; width: 18px; height: 18px;
  color: var(--fg); opacity: 0;
  animation: rise linear infinite;
}
@keyframes rise {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  10%  { opacity: .35; }
  90%  { opacity: .2; }
  100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
}

/* ---------- раскладка ---------- */
.stage {
  position: relative; z-index: 1;
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.card {
  width: 100%; max-width: 480px; box-sizing: border-box;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  border-radius: 28px;
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  box-shadow: 0 30px 80px rgba(20, 0, 5, .45);
  padding: 32px 24px 24px;
  display: flex; flex-direction: column; gap: 22px;
}
.step { display: flex; flex-direction: column; gap: 20px; animation: appear .45s ease both; }
@keyframes appear { from { opacity: .001; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.progress { height: 3px; border-radius: 3px; background: var(--chip-hover); overflow: hidden; }
.progress .fill { height: 100%; border-radius: 3px; background: var(--fg); transition: width .5s ease; }

.eyebrow { margin: 0; text-align: center; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-soft); font-weight: 700; }
h1 {
  margin: 0; text-align: center; text-wrap: balance;
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(36px, 9vw, 48px); line-height: 1.1;
}
.lead { margin: 0; text-align: center; color: var(--fg-soft); line-height: 1.5; }

/* ---------- варианты ---------- */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  font: inherit; font-weight: 700; color: var(--fg);
  background: var(--chip); border: 1px solid var(--glass-line);
  border-radius: 16px; padding: 14px 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  transition: background .2s, transform .15s, box-shadow .2s, border-color .2s;
}
.opt .ico { font-size: 24px; line-height: 1; }
.opt:hover { background: var(--chip-hover); }
.opt:active { transform: scale(.97); }
.opt[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent);
  box-shadow: 0 8px 28px var(--accent-glow);
}
.opt.wide { grid-column: 1 / -1; flex-direction: row; justify-content: center; }

.field {
  font: inherit; color: var(--fg); width: 100%; box-sizing: border-box;
  background: rgba(20, 0, 5, .25); border: 1px solid var(--glass-line);
  border-radius: 16px; padding: 14px 16px; resize: vertical;
}
.field::placeholder { color: var(--fg-soft); opacity: .7; }
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
textarea.field { min-height: 130px; line-height: 1.5; }

/* ---------- кнопки ---------- */
.nav { display: flex; gap: 10px; }
.btn {
  font: inherit; font-weight: 800; border-radius: 999px; padding: 14px 22px; cursor: pointer;
  border: 1px solid transparent; transition: transform .15s, opacity .2s, box-shadow .2s;
}
.btn:active { transform: scale(.97); }
.btn-main { flex: 1; background: var(--accent); color: var(--fg); box-shadow: 0 10px 30px var(--accent-glow); }
.btn-main:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--glass-line); }
.btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

.answer-row { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; min-height: 56px; }
.btn-no { background: var(--chip); color: var(--fg); border-color: var(--glass-line); }
.btn-no.loose { position: fixed; z-index: 5; transition: left .25s ease, top .25s ease; }

/* ---------- итог ---------- */
.summary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.summary li {
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
  background: var(--chip); border: 1px solid var(--glass-line); border-radius: 16px; padding: 14px 16px;
}
.summary .ico { font-size: 22px; line-height: 1.2; }
.summary .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-soft); font-weight: 700; }
.summary .v { font-weight: 700; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.signoff { margin: 0; text-align: center; font-family: var(--font-display); font-size: 30px; }
.copied { text-align: center; margin: 0; font-size: 14px; color: var(--fg-soft); min-height: 1.2em; }
.copy-fallback { font-size: 14px; }
.send { display: flex; flex-direction: column; gap: 10px; }
a.btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
a.btn svg { width: 22px; height: 22px; flex: none; }
.nav .btn-ghost { flex: 1; }

@media (prefers-reduced-motion: reduce) {
  .blob, .heart-float, .step { animation: none !important; }
  .heart-float { display: none; }
  .btn-no.loose { transition: none; }
}
</style>

<div class="backdrop" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div id="hearts"></div>
</div>

<main class="stage">
  <div class="card" id="card"></div>
</main>

<script>
// Лилия: шесть заострённых лепестков и тычинки в центре.
const LILY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
  [0, 60, 120, 180, 240, 300].map(r => '<g transform="rotate(' + r + ' 12 12)"><path d="M12 12C6.8 9.6 7.2 3.6 12 .6c4.8 3 5.2 9 0 11.4z"/></g>').join("") +
  '<circle cx="12" cy="12" r="2.2" fill="var(--bg)" opacity=".55"/></svg>';

// Шаги анкеты. type: "choice" — варианты + свой; "text" — только поле.
// Вариант: [иконка, подпись на кнопке, значение для итога (по умолчанию = подпись)].
const ALL_STEPS = [
  { key: "place", label: "Куда идём", icon: "📍", title: "Куда пойдём?", lead: "Выбери, что больше нравится, или предложи своё",
    options: [["🌆","Прогулка по городу"],["🐠","Океанариум"],["🎨","Выставка современного искусства"]] },
  { key: "cuisine", label: "Кухня", icon: "🥢", title: "Какую азиатскую кухню выбираешь?",
    options: [["🍣","Японскую","Японская"],["🍗","Корейскую","Корейская"],["🍲","Вьетнамскую","Вьетнамская"]] },
  // Варианты блюд зависят от выбранной кухни; при своём варианте кухни шаг пропускается.
  { key: "dish", label: "Блюдо", icon: "🍜", title: "А что предпочитаешь?", dependsOn: "cuisine",
    optionsBy: {
      "Японская": [["🍣","Роллы"],["🍜","Рамен"],["🍤","Темпура"]],
      "Корейская": [["🍗","Корейская курица"],["🍚","Пибимпап"],["🌶️","Токпокки"]],
      "Вьетнамская": [["🍲","Том ям"],["🍝","Пад тай"],["🍜","Фо бо"]],
    } },
  { key: "when", label: "Время", icon: "🕖", title: "Время?", lead: "Напиши, когда тебе удобно",
    type: "text", placeholder: "Например: в субботу в 18:00" },
  { key: "topics", label: "Темы для обсуждения", icon: "💬", title: "Темы для обсуждения!", lead: "Напиши, о чём хочешь поговорить. Можно оставить пустым",
    type: "text", multiline: true, optional: true, placeholder: "Например: путешествия, мечты, взгляды на жизнь, бьюти…" },
];

const state = { step: -1, answers: {}, custom: {} };

// Шаги, которые видны при текущих ответах.
function steps() {
  return ALL_STEPS.flatMap(s => {
    if (!s.dependsOn) return [s];
    const parent = state.answers[s.dependsOn];
    if (state.custom[s.dependsOn]) return [];
    return [{ ...s, options: s.optionsBy[parent] || [] }];
  });
}
const card = document.getElementById("card");

// Куда отправлять план. Username без @; пусто — откроется общий выбор чата.
const TG_USER = "";
const IG_USER = "";

function tgLink(text) {
  return TG_USER ? "https://t.me/" + TG_USER + "?text=" + encodeURIComponent(text)
                 : "https://t.me/share/url?url=" + encodeURIComponent(text);
}
function igLink() {
  return IG_USER ? "https://ig.me/m/" + IG_USER : "https://www.instagram.com/direct/inbox/";
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

// Тонкая полоска: заполнение плавно растёт от прошлого значения к новому.
let lastPct = 0;
function progress() {
  const n = steps().length, pct = Math.min(100, Math.round((state.step + 1) / n * 100));
  const from = lastPct; lastPct = pct;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const f = card.querySelector(".progress .fill"); if (f) f.style.width = pct + "%";
  }));
  return '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="fill" style="width:' + from + '%"></div></div>';
}

function render() {
  resetNo();
  if (state.step === -1) return renderIntro();
  if (state.step === steps().length) return renderFinal();
  const s = steps()[state.step];
  const val = state.answers[s.key] || "";
  let body;
  if (s.type === "text") {
    const attrs = 'class="field" id="f-' + s.key + '" placeholder="' + esc(s.placeholder) + '" aria-label="' + esc(s.title) + '"';
    body = s.multiline ? "<textarea " + attrs + ">" + esc(val) + "</textarea>"
                       : "<input " + attrs + ' value="' + esc(val) + '">';
  } else {
    const isCustom = state.custom[s.key];
    body = '<div class="options">' +
      s.options.map(([ico, t, v = t], i) => '<button type="button" class="opt' + (s.options.length % 2 && i === s.options.length - 1 ? " wide" : "") + '" data-v="' + esc(v) + '" aria-pressed="' + (!isCustom && val === v) + '"><span class="ico">' + ico + "</span>" + esc(t) + "</button>").join("") +
      '<button type="button" class="opt wide" data-custom aria-pressed="' + !!isCustom + '"><span class="ico">✏️</span>Свой вариант</button>' +
      "</div>" +
      '<input class="field" id="f-' + s.key + '" placeholder="Напиши свой вариант" aria-label="Свой вариант" value="' + (isCustom ? esc(val) : "") + '"' + (isCustom ? "" : " hidden") + ">";
  }
  card.innerHTML = '<section class="step">' + progress() +
    '<p class="eyebrow">Вопрос ' + (state.step + 1) + " из " + steps().length + "</p>" +
    "<h1>" + esc(s.title) + "</h1>" + (s.lead ? '<p class="lead">' + esc(s.lead) + "</p>" : "") + body +
    '<div class="nav"><button type="button" class="btn btn-ghost" id="back">Назад</button>' +
    '<button type="button" class="btn btn-main" id="next">' + (state.step === steps().length - 1 ? "Готово" : "Дальше") + "</button></div></section>";

  const field = document.getElementById("f-" + s.key);
  const next = document.getElementById("next");
  const sync = () => { next.disabled = !s.optional && !(state.answers[s.key] || "").trim(); };

  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
    card.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    const prev = state.custom[s.key] ? null : state.answers[s.key];
    if (b.dataset.v !== prev) ALL_STEPS.filter(d => d.dependsOn === s.key).forEach(d => { delete state.answers[d.key]; delete state.custom[d.key]; });
    if (b.hasAttribute("data-custom")) {
      state.custom[s.key] = true; field.hidden = false;
      state.answers[s.key] = field.value; field.focus();
    } else {
      state.custom[s.key] = false; field.hidden = true;
      state.answers[s.key] = b.dataset.v;
    }
    sync();
  }));
  field.addEventListener("input", () => { state.answers[s.key] = field.value; sync(); });
  document.getElementById("back").addEventListener("click", () => { state.step--; render(); });
  next.addEventListener("click", () => { state.step++; render(); });
  sync();
}

function renderIntro() {
  card.innerHTML = '<section class="step">' +
    '<p class="eyebrow">У меня есть идея</p>' +
    "<h1>Мария, пойдёшь со мной на свидание?</h1>" +
    '<p class="lead">Осталось только всё спланировать</p>' +
    '<div class="answer-row"><button type="button" class="btn btn-main" id="yes">Да</button>' +
    '<button type="button" class="btn btn-no" id="no">Нет</button></div></section>';
  document.getElementById("yes").addEventListener("click", () => { state.step = 0; render(); });
  const no = document.getElementById("no");
  const flee = e => {
    if (e) e.preventDefault();
    const r = no.getBoundingClientRect();
    if (!no.classList.contains("loose")) {
      no.style.left = r.left + "px"; no.style.top = r.top + "px";
      no.classList.add("loose"); void no.offsetWidth;
    }
    const pad = 16, w = window.innerWidth, h = window.innerHeight;
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * (w - r.width - pad * 2);
      y = pad + Math.random() * (h - r.height - pad * 2);
      tries++;
    } while (tries < 20 && Math.hypot(x - r.left, y - r.top) < 120);
    no.style.left = x + "px"; no.style.top = y + "px";
  };
  no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") flee(); });
  no.addEventListener("touchstart", flee, { passive: false });
  no.addEventListener("click", flee);
  no.addEventListener("focus", () => no.blur());
}

function resetNo() {
  const old = document.getElementById("no");
  if (old) old.remove();
}

function summaryText() {
  return "Наше свидание\n" + steps().map(s => s.icon + " " + s.label + ": " + ((state.answers[s.key] || "").trim() || "решим по ходу")).join("\n");
}

function renderFinal() {
  card.innerHTML = '<section class="step">' + progress() +
    '<p class="eyebrow">Всё решено</p><h1>Итак, наше свидание:</h1>' +
    '<ul class="summary">' + steps().map(s =>
      '<li><span class="ico">' + s.icon + '</span><div><div class="k">' + esc(s.label) + '</div><div class="v">' +
      esc((state.answers[s.key] || "").trim() || "Решим по ходу") + "</div></div></li>").join("") + "</ul>" +
    '<p class="signoff">Жду с нетерпением</p>' +
    '<p class="lead">Осталось отправить твой выбор, и я всё подготовлю!</p>' +
    '<div class="send"><a class="btn btn-main" id="tg" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.6 19.8c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.2-8.3c.4-.4-.1-.6-.6-.2L6 13.4l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6l19.2-7.4c.9-.3 1.7.2 1.4 1.4z"/></svg>Отправить в Telegram</a>' +
    '<a class="btn btn-main" id="ig" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>Отправить в Instagram</a></div>' +
    '<div class="nav"><button type="button" class="btn btn-ghost" id="back">Изменить</button>' +
    '<button type="button" class="btn btn-ghost" id="copy">Скопировать текст</button></div>' +
    '<p class="copied" id="copied" aria-live="polite"></p></section>';
  const text = summaryText();
  const out = document.getElementById("copied");
  const copy = okMsg => {
    const fallback = () => {
      out.innerHTML = 'Не получилось скопировать автоматически. Выдели текст ниже и скопируй:<textarea class="field copy-fallback" id="copy-fallback" readonly rows="6"></textarea>';
      const ta = document.getElementById("copy-fallback");
      ta.value = text; ta.focus(); ta.select();
    };
    try { navigator.clipboard.writeText(text).then(() => { out.textContent = okMsg; }, fallback); }
    catch (e) { fallback(); }
  };
  document.getElementById("tg").href = tgLink(text);
  const ig = document.getElementById("ig");
  ig.href = igLink();
  // В Instagram нельзя передать текст ссылкой, поэтому копируем его заранее.
  ig.addEventListener("click", () => copy("Текст скопирован. Вставь его в чат и отправь 😊"));
  document.getElementById("copy").addEventListener("click", () => copy("Скопировано! Теперь вставь это в сообщение мне 😊"));
  document.getElementById("back").addEventListener("click", () => { state.step--; render(); });
}

// плывущие лилии на фоне
(function () {
  const box = document.getElementById("hearts");
  for (let i = 0; i < 12; i++) {
    const d = document.createElement("div");
    d.className = "heart-float";
    d.innerHTML = LILY;
    const size = 16 + Math.random() * 22;
    d.style.width = d.style.height = size + "px";
    d.style.left = Math.random() * 100 + "%";
    d.style.animationDuration = 14 + Math.random() * 16 + "s";
    d.style.animationDelay = -Math.random() * 30 + "s";
    box.appendChild(d);
  }
})();

render();
</script>

</body>
</html>
